<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Counter</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: #f2f2f2;
        }

        .counter-box {
            width: 350px;

            padding: 40px;

            text-align: center;

            background: white;

            border-radius: 15px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .counter-box h1 {
            margin-bottom: 20px;
        }

        #count {
            font-size: 60px;
            margin: 20px 0;
        }

        .buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        button {
            padding: 10px 20px;

            border: none;
            border-radius: 6px;

            cursor: pointer;

            font-size: 16px;
        }
    </style>
</head>

<body>

    <div class="counter-box">

        <h1>Counter</h1>

        <h2 id="count">0</h2>

        <div class="buttons">
            <button id="decrease">-</button>
            <button id="reset">Reset</button>
            <button id="increase">+</button>
        </div>

    </div>
    <script>
        let counter = 0;
        let limit = 10;

        let counterValue = document.querySelector("#count");

        let incBtn = document.querySelector("#increase");
        let decBtn = document.querySelector("#decrease");
        let resetBtn = document.querySelector("#reset");

        incBtn.addEventListener("click",function(){
            counter++; // counter = counter + 1 ==> counter = 0+1 ==> counter = 1
            counterValue.textContent = counter;
            console.log(counter)
        })

        decBtn.addEventListener("click",function(){
            counter--; // counter = counter + 1 ==> counter = 0+1 ==> counter = 1
            counterValue.textContent = counter;
            console.log(counter)
        })

        resetBtn.addEventListener("click",function(){
            counter = 0;
            counterValue.textContent = counter;
        })


    </script>
    

</body>

</html>
