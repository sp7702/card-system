<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram Like</title>

    <style>
        body {
            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            font-family: Arial, sans-serif;

            background: #f5f5f5;
        }

        .post {
            width: 350px;

            padding: 15px;

            background: white;

            border-radius: 10px;
        }

        .post img {
            width: 100%;

            height: 350px;

            object-fit: cover;

            border-radius: 8px;
        }

        #likeButton {
            border: none;

            background: none;

            font-size: 40px;

            cursor: pointer;
        }

        .liked {
            color: red;
        }
    </style>

</head>

<body>

    <div class="post">

        <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb" alt="Post">

        <button id="likeButton">
            ♡
        </button>

        <p>
            Likes: <span id="likeCount">0</span>
        </p>

    </div>

    <script>
        const likeButton =
            document.querySelector("#likeButton");

        const likeCount =
            document.querySelector("#likeCount");

        let likes = 0;

        likeButton.addEventListener("click", function () {

            if (likes === 0) {

                likes = 1;

                likeButton.textContent = "♥";

                likeButton.classList.add("liked");

            } else {

                likes = 0;

                likeButton.textContent = "♡";

                likeButton.classList.remove("liked");

            }

            likeCount.textContent = likes;

        });
    </script>

</body>

</html>
