<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Theme Toggle</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            font-family: Arial, sans-serif;

            background: white;

            color: black;

            transition: 0.3s;
        }

        .container {
            min-height: 100vh;

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;
        }

        button {
            padding: 12px 20px;

            border: none;

            border-radius: 6px;

            cursor: pointer;
        }

        /* Dark Theme */

        .dark {
            background: #121212;
            color: white;
        }
    </style>

</head>

<body>

    <div class="container">

        <button id="themeButton">
            🌙 Dark Mode
        </button>

        <h1>Theme Toggle</h1>

        <p>
            Click the button to change the website theme.
        </p>

    </div>

    <script>
        let btn = document.querySelector("#themeButton");

        btn.addEventListener("click",function(){
            document.body.classList.toggle("dark");
            if(document.body.classList.contains("dark")){
                btn.textContent = "☀️Light Mode"
            }else{
                btn.textContent = "🌙 Dark Mode"
            }
            
        });
    </script>

</body>

</html>
