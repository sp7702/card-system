<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Toggle Password</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #f4f4f4;
        }

        .login-box {
            width: 350px;

            padding: 30px;

            background: white;

            border-radius: 10px;

            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        .password-box {
            display: flex;

            border: 1px solid #ccc;

            border-radius: 6px;

            overflow: hidden;
        }

        .password-box input {
            flex: 1;

            border: none;

            padding: 12px;

            outline: none;
        }

        .password-box button {
            border: none;

            background: white;

            cursor: pointer;

            padding: 0 15px;
        }
    </style>

</head>

<body>

    <div class="login-box">

        <h2>Login</h2>

        <div class="password-box">

            <input type="password" id="password_sample" placeholder="Enter password">
            <!-- <input type="text" id="password" placeholder="Enter password"> -->

            <button id="togglePassword">
                👁️
            </button>

        </div>

    </div>


    <script>
        let password = document.querySelector("#password_sample");
        console.log(password,"pass_obj")
        console.log(password.type)
        console.log(password.id)
        console.log(password.placeholder)
        let toggleBtn = document.querySelector("#togglePassword");

        toggleBtn.addEventListener("click",function(){
            if(password.type === "password"){
                password.type = "text";
                toggleBtn.textContent = "🙈";

                console.log(password,"After Update")
            } else{
                password.type = "password";
                toggleBtn.textContent = "👁️";
                console.log(password,"After Update hide")
            }
        })




    </script>


</body>

</html>
